<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>복약 트래커</title>
  <meta name="description" content="복용 간격과 하루 최대치를 기준으로 다음 복용 가능 시각을 계산하는 로컬 전용 복약 트래커">
  <meta name="theme-color" content="#F4F4F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="복약 트래커">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 리퀴드 글라스(굴절) 필터 — 설정에서 켤 때만 하단 바에 적용. 지원 브라우저에서만 왜곡이 보임 -->
  <svg class="glass-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="liquid-glass" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="2" seed="9" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="22" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="1.4"/>
    </filter>
  </svg>
  <div id="app" role="main"></div>
  <script src="./app.js"></script>
</body>
</html>
